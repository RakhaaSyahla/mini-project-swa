<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Project - Website Informasi Kegiatan</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 700px; background: white; padding: 30px; margin: 20px auto; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2 { color: #0078d4; }
        .info-box { background: #e1f5fe; padding: 15px; border-left: 5px solid #0288d1; border-radius: 4px; margin-bottom: 20px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, select, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: #0078d4; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 20px; }
        button:hover { background-color: #005a9e; }
        .result { background: #f9f9f9; padding: 15px; margin-top: 20px; border-radius: 5px; border: 1px solid #ddd; white-space: pre-wrap; font-family: monospace; display: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- Identitas Sesuai Exercise -->
    <h1>Website Informasi Kegiatan Mahasiswa</h1>
    <div class="info-box">
        <p><strong>Nama Mahasiswa:</strong> Rakha</p>
        <p><strong>Identitas:</strong> Praktikum Cloud Computing - Mini Project</p>
        <p><strong>Layanan Azure:</strong> Azure Static Web Apps & Azure Functions</p>
    </div>

    <h2>Kalkulator Estimasi Biaya Konsumsi</h2>
    <form id="calcForm">
        <label for="jumlah">Jumlah Peserta:</label>
        <input type="number" id="jumlah" placeholder="Contoh: 40" required min="1">

        <label for="jenis">Jenis Konsumsi:</label>
        <select id="jenis">
            <option value="snack">Snack (Rp15.000)</option>
            <option value="makan">Makan (Rp30.000)</option>
            <option value="lengkap">Lengkap (Rp45.000)</option>
        </select>

        <button type="button" onclick="hitungBiaya()">Hitung Estimasi Biaya</button>
    </form>

    <div id="output" class="result"></div>
</div>

<script>
    async function hitungBiaya() {
        const jumlah = document.getElementById('jumlah').value;
        const jenis = document.getElementById('jenis').value;
        const outputDiv = document.getElementById('output');
        
        // !!! GANTI DENGAN URL FUNCTION KEY KAMU YANG TADI DISALIN DI LANGKAH SEBELUMNYA !!!
        const baseApiUrl = "https://func-serverless-045-dvc6czf7c6axcua4.southeastasia-01.azurewebsites.net/api/HttpTrigger045"; 
        
        const fullUrl = `${baseApiUrl}&jumlah=${jumlah}&jenis=${jenis}`;

        outputDiv.style.display = "block";
        outputDiv.innerText = "Menghitung...";

        try {
            const response = await fetch(fullUrl);
            const data = await response.json();
            outputDiv.innerText = JSON.stringify(data, null, 2);
        } catch (error) {
            outputDiv.innerText = "Gagal memanggil API. Pastikan CORS di Azure Function sudah diizinkan.";
        }
    }
</script>
</body>
</html>
